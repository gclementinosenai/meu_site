<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📞Contato📞</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header class="cabecalho">
        <div class="logo">🎥CineSenai🎥</div>
        <nav class="menu">
            <a href="index.html">🪧Em cartaz🪧 </a>
            <a href="em_breve.html">📆Em breve📆 </a>
            <a href="preco.html">💰Preços💰 </a>
            <a href="">📞Contato📞 </a>
            <a href="cardapio.html">🍽️Cardápio🍽️ </a>
        </nav>
    </header>

    <main class="container">
        <h1 class="titulo-secao">Cadastro para dicas de filmes</h1>
        <p class="subtitulo">Preencha seus dados para realizar a inscrição no CineSenai</p>

        <div class="area_inscricao">
            <form action="/processar cadastro" method="post" class="coluna_form">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite uma senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu email (exemplo@gmail.com)"><br>

                <label for="data_nascimento">Data de nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" min="1900-01-01" max="2026-12-31"><br><br>

                <label>Período dos filmes</label><br>
                <input type="radio" id="turno_manha" name="turno" value="manha" required>
                <label for="turno_manha">Manhã</label>

                <input type="radio" id="turno_tarde" name="turno" value="tarde">
                <label for="turno_tarde">Tarde</label>

                <input type="radio" id="turno_noite" name="turno" value="noite">
                <label for="turno_noite">Noite</label><br><br>

                <label>Filmes de Interesse</label><br>
                <input type="checkbox" id="acao" name="interesse" value="acao">
                <label for="acao">Filmes de Ação</label><br>

                <input type="checkbox" id="comedia" name="interesse" value="comedia">
                <label for="comedia">Filme de Comédia</label><br>

                <input type="checkbox" id="terror" name="interesse" value="terror">
                <label for="terror">Filme de Terror</label><br><br>

                <label for="unidade">Selecione o Cinema</label>
                <select name="unidade" id="unidade" required>
                    <option value="" disa selected>Selecione um Cinema</option>
                    <option value="SP">São Paulo</option>
                    <option value="votuporanga">Votuporanga</option>
                    <option value="monte azul paulista">Monte Azul Paulista</option>
                    <option value="dourados-ms">Dourados-MS</option>
                    <option value="aracatuba">Araçatuba</option><br>



                </select><br>
                <input type="checkbox" id="termos" name="ternos" required>
                <label for="termos">Li e aceito os termos</label><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar</button>
                
            </form>

            <div class="coluna-midia">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1789.9243881811187!2d-49.96209664748584!3d-20.413591973317086!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd59003f2532ab%3A0xcf16f8c566d3a660!2sShopping%20Park%20Votuporanga!5e1!3m2!1spt-BR!2sbr!4v1787834180326!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

            </div>

        </div>
    </main>
</body>
</html>
